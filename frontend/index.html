<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EILCO Tech - Gestion de Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold">🏪 EILCO Tech</h1>
            <p class="text-sm opacity-90 mt-1">Gestion du catalogue, des ventes et des stocks</p>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-6xl mx-auto px-4 py-8">

        <!-- ============================================
             SECTION AJOUTER UN PRODUIT (IK)
             ============================================ -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-2xl font-bold text-primary mb-6 border-b-2 border-gray-100 pb-3">
                ➕ Ajouter un produit
            </h2>

            <form id="form-ajout" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

                <div>
                    <label for="categorie" class="block text-sm font-semibold text-gray-700 mb-1">
                        Catégorie *
                    </label>
                    <select id="categorie" required
                            class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                        <option value="">-- Choisir --</option>
                        <option value="Smartphones">Smartphones</option>
                        <option value="Ordinateurs">Ordinateurs</option>
                        <option value="Électroménagers">Électroménagers</option>
                    </select>
                </div>

                <div id="div-sous-categorie" class="hidden">
                    <label for="sousCategorie" class="block text-sm font-semibold text-gray-700 mb-1">
                        Sous-catégorie *
                    </label>
                    <select id="sousCategorie"
                            class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                        <option value="">-- Choisir --</option>
                        <option value="Aspirateurs">Aspirateurs</option>
                        <option value="Réfrigérateurs">Réfrigérateurs</option>
                        <option value="Machines à laver">Machines à laver</option>
                    </select>
                </div>

                <div>
                    <label for="marque" class="block text-sm font-semibold text-gray-700 mb-1">
                        Marque *
                    </label>
                    <select id="marque" required
                            class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                        <option value="">-- Choisir une catégorie d'abord --</option>
                    </select>
                </div>

                <div>
                    <label for="nom" class="block text-sm font-semibold text-gray-700 mb-1">
                        Nom commercial *
                    </label>
                    <input type="text" id="nom" required
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition"
                           placeholder="Ex: Galaxy S25, iPhone 15">
                </div>

                <div>
                    <label for="version" class="block text-sm font-semibold text-gray-700 mb-1">
                        Version *
                    </label>
                    <input type="text" id="version" required
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition"
                           placeholder="Ex: 15, S25...">
                </div>

                <div>
                    <label for="quantite" class="block text-sm font-semibold text-gray-700 mb-1">
                        Quantité (0-10) *
                    </label>
                    <input type="number" id="quantite" min="0" max="10" required
                           class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition"
                           placeholder="Ex: 5">
                </div>

                <div class="md:col-span-2 lg:col-span-3">
                    <button type="submit"
                            class="w-full md:w-auto px-8 py-3 bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-lg hover:opacity-90 transition shadow-md">
                        ➕ Ajouter le produit
                    </button>
                </div>
            </form>

            <div id="message" class="mt-4 hidden"></div>
        </section>

        <!-- ============================================
             SECTION LISTE DES PRODUITS (FB - TEST-50)
             ============================================ -->
        <section class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold text-primary mb-6 border-b-2 border-gray-100 pb-3">
                📋 Liste des produits
            </h2>

            <div id="liste-produits" class="space-y-3">
                <!-- Les produits seront affichés ici par JavaScript -->
            </div>
        </section>

    </main>

    <!-- ============================================
         MODAL DÉTAIL PRODUIT (FB - TEST-50)
         ============================================ -->
    <div id="modal-detail" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">

            <div class="bg-gradient-to-r from-primary to-secondary text-white p-4 rounded-t-xl flex justify-between items-center">
                <h3 class="text-xl font-bold">📦 Détail du produit</h3>
                <button onclick="fermerModal()"
                        class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-8 h-8 flex items-center justify-center text-2xl transition">
                    ×
                </button>
            </div>

            <div id="modal-contenu" class="p-6">
                <!-- Le contenu sera rempli par JavaScript -->
            </div>

            <div class="bg-gray-50 p-4 rounded-b-xl flex justify-end gap-2">
                <button onclick="fermerModal()"
                        class="px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================
         MODAL CONFIRMATION SUPPRESSION (FB - TEST-53)
         ============================================ -->
    <div id="modal-suppression" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full">

            <div class="bg-red-500 text-white p-4 rounded-t-xl">
                <h3 class="text-xl font-bold">⚠️ Confirmer la suppression</h3>
            </div>

            <div class="p-6">
                <p class="text-gray-700 mb-4">
                    Voulez-vous vraiment supprimer ce produit ?
                </p>
                <div id="modal-suppression-info" class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
                    <!-- Le nom et la référence seront remplis par JavaScript -->
                </div>
                <p class="text-sm text-gray-500 mt-4">
                    Cette action est irréversible.
                </p>
            </div>

            <div class="bg-gray-50 p-4 rounded-b-xl flex justify-end gap-2">
                <button onclick="fermerModalSuppression()"
                        class="px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition">
                    Annuler
                </button>
                <button id="btn-confirmer-suppression"
                        class="px-6 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition">
                    🗑️ Supprimer
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================
         MODAL MODIFICATION (FB - TEST-52)
         ============================================ -->
    <div id="modal-modification" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">

            <div class="bg-gradient-to-r from-primary to-secondary text-white p-4 rounded-t-xl flex justify-between items-center">
                <h3 class="text-xl font-bold">✏️ Modifier le produit</h3>
                <button onclick="fermerModalModification()"
                        class="text-white hover:bg-white hover:bg-opacity-20 rounded-full w-8 h-8 flex items-center justify-center text-2xl transition">
                    ×
                </button>
            </div>

            <form id="form-modification" class="p-6">
                <input type="hidden" id="mod-reference-originale">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label for="mod-categorie" class="block text-sm font-semibold text-gray-700 mb-1">
                            Catégorie *
                        </label>
                        <select id="mod-categorie" required
                                class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                            <option value="">-- Choisir --</option>
                            <option value="Smartphones">Smartphones</option>
                            <option value="Ordinateurs">Ordinateurs</option>
                            <option value="Électroménagers">Électroménagers</option>
                        </select>
                    </div>

                    <div id="mod-div-sous-categorie" class="hidden">
                        <label for="mod-sousCategorie" class="block text-sm font-semibold text-gray-700 mb-1">
                            Sous-catégorie *
                        </label>
                        <select id="mod-sousCategorie"
                                class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                            <option value="">-- Choisir --</option>
                            <option value="Aspirateurs">Aspirateurs</option>
                            <option value="Réfrigérateurs">Réfrigérateurs</option>
                            <option value="Machines à laver">Machines à laver</option>
                        </select>
                    </div>

                    <div>
                        <label for="mod-marque" class="block text-sm font-semibold text-gray-700 mb-1">
                            Marque *
                        </label>
                        <select id="mod-marque" required
                                class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>

                    <div>
                        <label for="mod-nom" class="block text-sm font-semibold text-gray-700 mb-1">
                            Nom commercial *
                        </label>
                        <input type="text" id="mod-nom" required
                               class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                    </div>

                    <div>
                        <label for="mod-version" class="block text-sm font-semibold text-gray-700 mb-1">
                            Version *
                        </label>
                        <input type="text" id="mod-version" required
                               class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                    </div>

                    <div>
                        <label for="mod-reference" class="block text-sm font-semibold text-gray-700 mb-1">
                            Référence *
                        </label>
                        <input type="text" id="mod-reference" required
                               class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition font-mono">
                    </div>

                    <div>
                        <label for="mod-quantite" class="block text-sm font-semibold text-gray-700 mb-1">
                            Quantité (0-10) *
                        </label>
                        <input type="number" id="mod-quantite" min="0" max="10" required
                               class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-primary focus:outline-none transition">
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-gray-200">
                    <button type="button" onclick="fermerModalModification()"
                            class="px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition">
                        Annuler
                    </button>
                    <button type="submit"
                            class="px-6 py-2 bg-gradient-to-r from-primary to-secondary text-white font-semibold rounded-lg hover:opacity-90 transition">
                        💾 Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center text-gray-500 text-sm py-6">
        EILCO Tech - Projet Scrum - 2026
    </footer>

    <script src="index.js"></script>
</body>
</html>
